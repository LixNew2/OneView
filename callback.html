<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C2333">
<meta name="robots" content="noindex">
<title>OneView</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1C2333;--text:#E8EEF9;--sub:#8D99B0;--blue:#4D8DFF;--red:#FF5A5A;--green:#34D399;
--dark:rgba(8,11,19,.78);--light:rgba(56,70,99,.42);
--out:9px 9px 20px var(--dark),-7px -7px 18px var(--light);
--in:inset 5px 5px 10px var(--dark),inset -4px -4px 9px var(--light)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(520px 420px at 50% 32%,rgba(77,141,255,.18),rgba(77,141,255,0) 70%),var(--bg);color:var(--text);
font-family:Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.card{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:104px;height:104px;border-radius:32px;background:var(--bg);box-shadow:var(--out),0 0 60px rgba(77,141,255,.25);
display:flex;align-items:center;justify-content:center;margin-bottom:28px}
.badge{width:44px;height:44px;border-radius:22px;background:var(--bg);box-shadow:var(--in);display:flex;align-items:center;justify-content:center;margin:-52px 0 18px 76px}
h1{font-size:26px;font-weight:800;letter-spacing:-.6px;margin:0 0 10px}
p{font-size:15px;line-height:1.5;color:var(--sub);margin:0 0 30px;max-width:300px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;border-radius:20px;
background:var(--blue);color:#fff;font-size:17px;font-weight:600;text-decoration:none;
box-shadow:0 10px 30px rgba(77,141,255,.35),inset 0 1px 0 rgba(255,255,255,.2);-webkit-tap-highlight-color:transparent;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.98);opacity:.9}
.hint{font-size:12.5px;color:#5B6782;margin-top:18px}
.hidden{display:none}
</style>
</head>
<body>
<main class="card">
  <div class="logo">
    <svg width="68" height="68" viewBox="180 180 664 664" aria-hidden="true">
      <defs>
        <linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7AAAFF"/><stop offset="1" stop-color="#3B78F0"/></linearGradient>
        <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8EEF9"/><stop offset="1" stop-color="#A9C4F5"/></linearGradient>
      </defs>
      <path d="M784.5 412.8A290 290 0 1 1 611.2 239.5" fill="none" stroke="url(#r)" stroke-width="84" stroke-linecap="round"/>
      <circle cx="717" cy="307" r="50" fill="#4D8DFF"/>
      <rect x="360" y="530" width="76" height="120" rx="38" fill="url(#b)"/>
      <rect x="474" y="455" width="76" height="195" rx="38" fill="url(#b)"/>
      <rect x="588" y="370" width="76" height="280" rx="38" fill="url(#b)"/>
    </svg>
  </div>
  <div class="badge" id="badge"></div>
  <h1 id="title">Almost done</h1>
  <p id="text">Head back to OneView to finish connecting your account.</p>
  <a class="btn" id="l" href="#">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    Back to OneView
  </a>
  <div class="hint" id="hint">If the app doesn't open, tap the button above.</div>
</main>
<script>
var OK = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var KO = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF5A5A" stroke-width="2.8" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>';
var $ = function (id) { return document.getElementById(id); };
var p = new URLSearchParams(location.search);
var state = p.get('state') || '';
var target = state.slice(state.indexOf('|') + 1);
var err = p.get('error') || '';
var q = new URLSearchParams({ code: p.get('code') || '', state: state, error: err, error_description: p.get('error_description') || '' }).toString();
var dest = target === 'app' ? 'oneview://oauth?' + q
  : /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(target) ? target + '/?' + q : null;
if (dest) {
  $('l').href = dest;
  $('badge').innerHTML = err ? KO : OK;
  if (err) {
    $('title').textContent = 'Sign-in cancelled';
    $('text').textContent = 'No account was linked. Go back to OneView to try again.';
  }
  location.replace(dest);
} else {
  $('badge').innerHTML = KO;
  $('title').textContent = 'Invalid target';
  $('text').textContent = 'This page is only used to sign in from the OneView app.';
  $('l').classList.add('hidden');
  $('hint').classList.add('hidden');
}
</script>
</body>
</html>
